<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kdy to jede? - Metro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <button id="theme-toggle" class="theme-toggle" aria-label="Přepnout motiv">🌓</button>
        <header>
            <img src="img/metro.png" id="hero-image" class="hero-image initial-state" alt="Metro">
            <div class="logo initial-state" id="main-logo">Kdy to jede?</div>
            <h1 id="station-title" class="hidden">Výběr stanice</h1>

            <div class="search-container initial-state" id="search-container">
                <div class="input-wrapper">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" id="station-search-autocomplete" disabled spellcheck="false">
                    <input type="text" id="station-search" placeholder="Vyhledejte stanici metra..." autocomplete="off"
                        spellcheck="false">
                    <svg class="search-arrow" id="search-submit" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 9l3 3m0 0l-3 3m3-3H8m13 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <ul id="search-results" class="hidden"></ul>
            </div>
        </header>

        <main>
            <!-- Data section for departures -->
            <div id="data-container" class="hidden">
                <div class="directions-container" id="directions-wrapper">
                    <!-- Columns will be injected here dynamically -->
                </div>
                <div class="actions" style="margin-top:2rem; text-align:center;">
                    <button id="refresh-btn"
                        style="background:rgba(0,0,0,0.05); color:var(--text-secondary); border:1px solid rgba(0,0,0,0.1); font-size:0.95rem; padding:0.6rem 1.2rem; cursor:pointer;">&#8635;
                        Obnovit
                        data</button>
                </div>
            </div>
        </main>

        <div class="loader hidden" id="loader">Načítám čerstvá data...</div>

        <footer>
            Data poskytuje <a href="https://golemio.cz" target="_blank">Otevřená data Praha (Golemio)</a>
        </footer>
    </div>
    <script src="app.js"></script>
</body>

</html>
