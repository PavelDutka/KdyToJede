<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kdy to jede? - Metro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="logo">🚇 Kdy to jede?</div>
            <h1 id="station-title" class="hidden">Výběr stanice</h1>

            <div class="search-container initial-state" id="search-container">
                <input type="text" id="station-search" placeholder="Vyhledejte stanici metra (např. Muzeum)..."
                    autocomplete="off">
                <ul id="search-results" class="hidden"></ul>
            </div>
        </header>

        <main>
            <!-- Data section for departures -->
            <div id="data-container" class="hidden">
                <div class="directions-container" id="directions-wrapper">
                    <!-- Columns will be injected here dynamically -->
                </div>
                <div class="actions" style="margin-top:2rem; text-align:center;">
                    <button id="refresh-btn"
                        style="background:rgba(255,255,255,0.1); color:#fff; font-size:0.9rem; padding:0.5rem 1rem;">Obnovit
                        data</button>
                </div>
            </div>
        </main>

        <div class="loader hidden" id="loader">Načítám čerstvá data...</div>

        <footer>
            Data poskytuje <a href="https://golemio.cz" target="_blank">Otevřená data Praha (Golemio)</a>
        </footer>
    </div>
    <script src="app.js"></script>
</body>

</html>
